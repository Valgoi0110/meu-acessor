<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Livro Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0F0D;
    --card: #141F19;
    --card-alt: #1B2A22;
    --line: #24352C;
    --ink: #ECF3EE;
    --ink-soft: #8CA398;
    --emerald: #34C77E;
    --emerald-deep: #21A968;
    --amber: #E0A83E;
    --rust: #E4715B;
    --rust-bg: rgba(228,113,91,0.14);
    --shadow: 0 2px 10px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 35px, rgba(52,199,126,0.035) 35px, rgba(52,199,126,0.035) 70px);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    padding-bottom: 110px;
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px;
  }
  header{
    padding: 28px 16px 18px;
    text-align: center;
  }
  header .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--emerald);
    font-weight: 500;
  }
  header h1{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 34px;
    margin: 4px 0 4px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  header .date-today{
    margin: 0;
    color: var(--ink-soft);
    font-size: 13px;
    text-transform: capitalize;
  }

  .tabs{
    display: flex;
    gap: 6px;
    margin: 18px 0 14px;
    background: var(--card-alt);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
  }
  .tab{
    flex: 1;
    text-align: center;
    padding: 8px 0;
    font-size: 13px;
    font-weight: 600;
    border-radius: 9px;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all .15s ease;
    user-select: none;
  }
  .tab.active{
    background: var(--card);
    color: var(--emerald);
    box-shadow: var(--shadow);
  }

  .summary-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    margin-bottom: 16px;
  }
  .summary-top{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .summary-top .label{
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .summary-top .total{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
  }

  .summary-body{
    display: flex;
    gap: 18px;
    align-items: flex-start;
  }
  .donut-wrap{
    position: relative;
    width: 88px;
    height: 88px;
    flex-shrink: 0;
  }
  .donut{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    transition: background 0.3s ease;
  }
  .donut-hole{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--card);
  }

  .cat-list{ flex: 1; min-width: 0; }
  .cat-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin: 8px 0;
  }
  .cat-dot{
    width: 8px; height: 8px; border-radius: 50%; flex-shrink:0;
  }
  .cat-name{
    font-size: 13px;
    flex: 1;
    min-width: 0;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cat-val{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .empty-summary{
    color: var(--ink-soft);
    font-size: 13px;
    padding: 20px 0;
  }

  .payment-section{
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .payment-section .section-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .payment-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin: 6px 0;
  }
  .payment-row .cat-dot{ width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
  .payment-row .p-name{ font-size: 13px; flex: 1; color: var(--ink); }
  .payment-row .p-val{ font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink-soft); }

  .ledger{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .day-header{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 12px 18px 6px;
    background: var(--card-alt);
  }
  .entry{
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .entry:last-child{ border-bottom: none; }
  .entry:active{ background: var(--card-alt); }
  .entry-row{
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .entry-row .cat-dot{ margin-bottom: 2px; }
  .entry-row .desc{
    font-size: 14.5px;
    color: var(--ink);
    flex-shrink: 0;
    max-width: 55%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .entry-row .leader{
    flex: 1;
    border-bottom: 1.5px dotted var(--line);
    height: 1px;
    margin-bottom: 4px;
  }
  .entry-row .amount{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink);
    flex-shrink: 0;
  }
  .entry-payment{
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
    margin-left: 16px;
  }
  .empty-state{
    text-align: center;
    padding: 48px 24px;
    color: var(--ink-soft);
  }
  .empty-state .big{
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty-state .small{ font-size: 13px; line-height: 1.5; }

  .compose{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(11,15,13,0) 0%, var(--bg) 22%);
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .compose-inner{
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.45);
    padding: 6px 6px 6px 16px;
    align-items: center;
  }
  .compose-inner input{
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: transparent;
    padding: 10px 0;
  }
  .compose-inner input::placeholder{ color: #5C6F63; }
  .mic-btn, .send-btn{
    width: 42px; height: 42px;
    border-radius: 12px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s, transform .1s;
  }
  .mic-btn{
    background: var(--card-alt);
    color: var(--ink-soft);
  }
  .mic-btn.recording{
    background: var(--rust-bg);
    color: var(--rust);
  }
  .mic-btn:active, .send-btn:active{ transform: scale(0.94); }
  .send-btn{
    background: var(--emerald);
    color: #0B0F0D;
  }
  .send-btn:disabled{ background: #2C4A3B; color: #6B8A79; }
  .mic-btn svg, .send-btn svg{ width: 18px; height: 18px; }

  .toast{
    position: fixed;
    top: 18px; left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: var(--card-alt);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    transition: transform .25s ease;
    z-index: 100;
  }
  .toast.show{ transform: translateX(-50%) translateY(0); }
  .toast.error{ background: var(--rust-bg); color: var(--rust); border-color: var(--rust); }

  .modal-backdrop{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: flex-end;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .modal-backdrop.show{ opacity: 1; pointer-events: auto; }
  .modal{
    background: var(--card);
    border-top: 1px solid var(--line);
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(20px);
    transition: transform .2s ease;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-backdrop.show .modal{ transform: translateY(0); }
  .m-field{ margin-bottom: 14px; }
  .m-field label{
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .m-field input, .m-field select{
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card-alt);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    outline: none;
  }
  .m-field input:focus, .m-field select:focus{ border-color: var(--emerald); }
  .modal button{
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .m-save{ background: var(--emerald); color: #0B0F0D; }
  .m-delete{ background: var(--rust-bg); color: var(--rust); }
  .m-cancel{ background: var(--card-alt); color: var(--ink-soft); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Livro Caixa</div>
    <h1>Seus gastos</h1>
    <p class="date-today" id="dateToday"></p>
  </header>

  <div class="tabs">
    <div class="tab active" data-period="hoje">Hoje</div>
    <div class="tab" data-period="7dias">7 dias</div>
    <div class="tab" data-period="15dias">15 dias</div>
    <div class="tab" data-period="mes">Final do mês</div>
  </div>

  <div class="summary-card">
    <div class="summary-top">
      <div class="label" id="summaryLabel">Total de hoje</div>
      <div class="total" id="summaryTotal">R$ 0,00</div>
    </div>
    <div class="summary-body">
      <div class="donut-wrap">
        <div class="donut" id="donutChart"></div>
        <div class="donut-hole"></div>
      </div>
      <div class="cat-list" id="catBars"></div>
    </div>
    <div class="payment-section">
      <div class="section-label">Formas de pagamento</div>
      <div id="paymentBars"></div>
    </div>
  </div>

  <div class="ledger" id="ledger"></div>
</div>

<div class="compose">
  <div class="compose-inner">
    <input id="input" type="text" placeholder="ex: 14 reais e 35 centavos no lanche" autocomplete="off" />
    <button class="mic-btn" id="micBtn" type="button" aria-label="Falar gasto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
    </button>
    <button class="send-btn" id="sendBtn" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="m-field">
      <label>Descrição</label>
      <input type="text" id="mDescInput" />
    </div>
    <div class="m-field">
      <label>Valor</label>
      <input type="text" inputmode="decimal" id="mAmountInput" />
    </div>
    <div class="m-field">
      <label>Categoria</label>
      <select id="mCatInput"></select>
    </div>
    <div class="m-field">
      <label>Forma de pagamento</label>
      <select id="mPaymentInput"></select>
    </div>
    <button class="m-save" id="mSave">Salvar alterações</button>
    <button class="m-delete" id="mDelete">Excluir lançamento</button>
    <button class="m-cancel" id="mCancel">Cancelar</button>
  </div>
</div>

<script>
const CATEGORIES = {
  "Alimentação": "#E1793D",
  "Lanche": "#E85D75",
  "Transporte": "#5B9BC7",
  "Combustível": "#D9605C",
  "Moradia": "#9C89C7",
  "Saúde": "#4FCB9B",
  "Lazer": "#E0C24A",
  "Compras": "#CE7FC8",
  "Educação": "#6FBF8D",
  "Outros": "#8A8A82"
};

const PAYMENT_METHODS = {
  "Débito": "#5B9BC7",
  "Crédito": "#E0A83E",
  "Dinheiro": "#4FCB9B",
  "Não informado": "#556259"
};

let expenses = [];
let period = "hoje";
let pendingDeleteId = null;

const el = (id) => document.getElementById(id);
const input = el("input");
const sendBtn = el("sendBtn");
const micBtn = el("micBtn");
const toast = el("toast");
const ledger = el("ledger");
const catBars = el("catBars");
const paymentBars = el("paymentBars");
const donutChart = el("donutChart");
const summaryTotal = el("summaryTotal");
const summaryLabel = el("summaryLabel");

function fmt(v){
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function showToast(msg, isError){
  toast.textContent = msg;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

function setDateToday(){
  const now = new Date();
  let str = now.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  str = str.charAt(0).toUpperCase() + str.slice(1);
  el('dateToday').textContent = str;
}

function loadExpenses(){
  try{
    const raw = localStorage.getItem('livrocaixa_expenses');
    expenses = raw ? JSON.parse(raw) : [];
  }catch(e){
    expenses = [];
  }
  render();
}

function saveExpenses(){
  try{
    localStorage.setItem('livrocaixa_expenses', JSON.stringify(expenses));
  }catch(e){
    showToast('Não consegui salvar. Tenta de novo.', true);
  }
}

function filteredExpenses(){
  const now = new Date();
  if(period === 'hoje'){
    return expenses.filter(e => {
      const d = new Date(e.date);
      return d.toDateString() === now.toDateString();
    });
  }
  if(period === '7dias'){
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 7);
    return expenses.filter(e => new Date(e.date) >= cutoff);
  }
  if(period === '15dias'){
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 15);
    return expenses.filter(e => new Date(e.date) >= cutoff);
  }
  // 'mes' — relatório completo do mês atual
  return expenses.filter(e => {
    const d = new Date(e.date);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
}

function render(){
  const list = filteredExpenses();
  renderSummary(list);
  renderPaymentSummary(list);
  renderLedger(list);
}

function renderSummary(list){
  const labels = { hoje: 'Total de hoje', '7dias': 'Total (7 dias)', '15dias': 'Total (15 dias)', mes: 'Total do mês (relatório final)' };
  summaryLabel.textContent = labels[period] || 'Total';
  const total = list.reduce((s,e) => s + e.amount, 0);
  summaryTotal.textContent = fmt(total);

  const byCat = {};
  list.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
  const sorted = Object.entries(byCat).sort((a,b) => b[1]-a[1]);

  if(sorted.length === 0){
    catBars.innerHTML = '<div class="empty-summary">Nenhum gasto ainda.</div>';
    donutChart.style.background = 'var(--line)';
    return;
  }

  catBars.innerHTML = sorted.map(([cat, val]) => {
    const color = CATEGORIES[cat] || CATEGORIES["Outros"];
    const pct = total > 0 ? (val/total*100) : 0;
    return `<div class="cat-row">
      <div class="cat-dot" style="background:${color}"></div>
      <div class="cat-name">${cat}</div>
      <div class="cat-val">${fmt(val)} · ${pct.toFixed(0)}%</div>
    </div>`;
  }).join('');

  let cumulative = 0;
  const stops = sorted.map(([cat, val]) => {
    const color = CATEGORIES[cat] || CATEGORIES["Outros"];
    const start = cumulative;
    const pct = total > 0 ? (val/total*100) : 0;
    cumulative += pct;
    return `${color} ${start}% ${cumulative}%`;
  }).join(', ');
  donutChart.style.background = `conic-gradient(${stops})`;
}

function renderPaymentSummary(list){
  if(list.length === 0){
    paymentBars.innerHTML = '<div class="empty-summary">—</div>';
    return;
  }
  const byPayment = {};
  list.forEach(e => {
    const p = e.payment || 'Não informado';
    byPayment[p] = (byPayment[p] || 0) + e.amount;
  });
  const total = list.reduce((s,e) => s + e.amount, 0);
  const sorted = Object.entries(byPayment).sort((a,b) => b[1]-a[1]);

  paymentBars.innerHTML = sorted.map(([method, val]) => {
    const color = PAYMENT_METHODS[method] || PAYMENT_METHODS["Não informado"];
    const pct = total > 0 ? (val/total*100) : 0;
    return `<div class="payment-row">
      <div class="cat-dot" style="background:${color}"></div>
      <div class="p-name">${method}</div>
      <div class="p-val">${fmt(val)} · ${pct.toFixed(0)}%</div>
    </div>`;
  }).join('');
}

function renderLedger(list){
  if(list.length === 0){
    ledger.innerHTML = `<div class="empty-state">
      <div class="big">Página em branco</div>
      <div class="small">Manda seu primeiro gasto aqui embaixo,<br>tipo "gastei 15 no almoço no débito".</div>
    </div>`;
    return;
  }

  const sorted = [...list].sort((a,b) => new Date(b.date) - new Date(a.date));
  const groups = {};
  sorted.forEach(e => {
    const d = new Date(e.date);
    const key = d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', weekday: 'short' });
    if(!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  ledger.innerHTML = Object.entries(groups).map(([day, items]) => {
    const rows = items.map(e => {
      const color = CATEGORIES[e.category] || CATEGORIES["Outros"];
      const payment = e.payment || 'Não informado';
      return `<div class="entry" data-id="${e.id}">
        <div class="entry-row">
          <div class="cat-dot" style="background:${color}"></div>
          <div class="desc">${escapeHtml(e.description)}</div>
          <div class="leader"></div>
          <div class="amount">${fmt(e.amount)}</div>
        </div>
        <div class="entry-payment">${payment}</div>
      </div>`;
    }).join('');
    return `<div class="day-header">${day}</div>${rows}`;
  }).join('');

  ledger.querySelectorAll('.entry').forEach(node => {
    node.addEventListener('click', () => openModal(node.dataset.id));
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function openModal(id){
  const e = expenses.find(x => String(x.id) === String(id));
  if(!e) return;
  pendingDeleteId = e.id;

  el('mDescInput').value = e.description;
  el('mAmountInput').value = String(e.amount).replace('.', ',');

  const catSelect = el('mCatInput');
  catSelect.innerHTML = Object.keys(CATEGORIES).map(cat =>
    `<option value="${cat}" ${cat === e.category ? 'selected' : ''}>${cat}</option>`
  ).join('');

  const paySelect = el('mPaymentInput');
  const currentPayment = e.payment || 'Não informado';
  paySelect.innerHTML = Object.keys(PAYMENT_METHODS).map(p =>
    `<option value="${p}" ${p === currentPayment ? 'selected' : ''}>${p}</option>`
  ).join('');

  el('modalBackdrop').classList.add('show');
}

el('mCancel').addEventListener('click', () => {
  el('modalBackdrop').classList.remove('show');
});
el('modalBackdrop').addEventListener('click', (ev) => {
  if(ev.target.id === 'modalBackdrop') el('modalBackdrop').classList.remove('show');
});

el('mSave').addEventListener('click', () => {
  const expense = expenses.find(x => x.id === pendingDeleteId);
  if(!expense) return;

  const desc = el('mDescInput').value.trim();
  const amountRaw = el('mAmountInput').value.trim().replace(',', '.');
  const amount = parseFloat(amountRaw);
  const category = el('mCatInput').value;
  const payment = el('mPaymentInput').value;

  if(!desc || isNaN(amount) || amount <= 0){
    showToast('Preenche descrição e um valor válido.', true);
    return;
  }

  expense.description = desc;
  expense.amount = amount;
  expense.category = category;
  expense.payment = payment;

  saveExpenses();
  render();
  el('modalBackdrop').classList.remove('show');
  showToast('Lançamento atualizado.');
});

el('mDelete').addEventListener('click', () => {
  expenses = expenses.filter(e => e.id !== pendingDeleteId);
  saveExpenses();
  render();
  el('modalBackdrop').classList.remove('show');
  showToast('Lançamento excluído.');
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    period = tab.dataset.period;
    render();
  });
});

const CATEGORY_KEYWORDS = {
  "Lanche": ["lanche","salgado","coxinha","pastel","sanduíche","sanduiche","hot dog","cachorro quente","açaí","acai","sorvete","doce","chocolate","bala"],
  "Alimentação": ["mercado","supermercado","almoço","almoco","jantar","restaurante","ifood","padaria","comida","café","cafe","feira","pizza","hamburguer","hambúrguer"],
  "Transporte": ["uber","99","ônibus","onibus","metrô","metro","passagem","estacionamento","pedágio","pedagio","táxi","taxi"],
  "Combustível": ["posto","gasolina","álcool","alcool","etanol","combustível","combustivel","diesel"],
  "Moradia": ["aluguel","condomínio","condominio","luz","energia","água","agua","internet","gás","gas","iptu"],
  "Saúde": ["farmácia","farmacia","remédio","remedio","médico","medico","consulta","exame","dentista","plano de saúde","academia"],
  "Lazer": ["cinema","show","viagem","bar","festa","balada","jogo","streaming","netflix","spotify"],
  "Compras": ["loja","roupa","shopping","compra","tênis","tenis","sapato","presente"],
  "Educação": ["curso","livro","faculdade","escola","mensalidade","material escolar"]
};

const PAYMENT_KEYWORDS = {
  "Débito": ["débito","debito"],
  "Crédito": ["crédito","credito"],
  "Dinheiro": ["dinheiro","espécie","especie","cash","à vista","a vista"]
};

function detectPayment(lower){
  for(const [method, keywords] of Object.entries(PAYMENT_KEYWORDS)){
    for(const kw of keywords){
      if(lower.includes(kw)) return method;
    }
  }
  return "Não informado";
}

function extractAmount(lower){
  // "25 reais e 50 centavos" / "25 e 50 centavos"
  let m = lower.match(/(\d{1,4})(?:\s*reais)?\s*e\s*(\d{1,2})\s*centavos?/);
  if(m){
    const whole = parseInt(m[1], 10);
    const cents = parseInt(m[2], 10);
    return { value: whole + cents/100, matchedText: m[0] };
  }
  // "25,50" ou "25.50" (vírgula/ponto decimal já escritos)
  m = lower.match(/(?:r\$\s*)?(\d{1,6}[.,]\d{1,2})/);
  if(m){
    return { value: parseFloat(m[1].replace(',', '.')), matchedText: m[0] };
  }
  // "25 e 50" (dois números com "e" entre eles, sem a palavra "centavos")
  m = lower.match(/(\d{1,4})\s+e\s+(\d{1,2})\b/);
  if(m){
    const whole = parseInt(m[1], 10);
    const cents = parseInt(m[2], 10);
    return { value: whole + cents/100, matchedText: m[0] };
  }
  // "500 reais" — número seguido explicitamente da palavra "reais", sem "e...centavos" depois:
  // mantém como valor inteiro (protege valores redondos tipo 500, 1500)
  m = lower.match(/(\d{1,6})\s*reais\b/);
  if(m){
    return { value: parseFloat(m[1]), matchedText: m[0] };
  }
  // número solto, sem nenhuma palavra de apoio — provavelmente a fala juntou os números
  // (ex: "14 e 35" virou "1435"). Se tiver 3+ dígitos e não terminar em "00",
  // assume que os 2 últimos dígitos são os centavos.
  m = lower.match(/(?:r\$\s*)?(\d{1,6})/);
  if(m){
    const digits = m[1];
    if(digits.length >= 3 && !digits.endsWith('00')){
      const whole = digits.slice(0, -2);
      const cents = digits.slice(-2);
      return { value: parseInt(whole, 10) + parseInt(cents, 10)/100, matchedText: m[0] };
    }
    return { value: parseFloat(digits), matchedText: m[0] };
  }
  return null;
}

function parseExpense(text){
  const lower = text.toLowerCase();

  const amountResult = extractAmount(lower);
  if(!amountResult || isNaN(amountResult.value) || amountResult.value <= 0){
    return { is_expense: false };
  }
  const amount = amountResult.value;

  let category = 'Outros';
  outer:
  for(const [cat, keywords] of Object.entries(CATEGORY_KEYWORDS)){
    for(const kw of keywords){
      if(lower.includes(kw)){
        category = cat;
        break outer;
      }
    }
  }

  const payment = detectPayment(lower);

    let desc = text
    .replace(/gastei|paguei|comprei|gasto de|gasto com|foi/gi, '')
    .replace(/\d+(?:[.,]\d+)?/g, '')
    .replace(/centavos?|reais|r\$/gi, '')
    .replace(/débito|debito|crédito|credito|dinheiro|espécie|especie|cash|à vista|a vista/gi, '')
    .replace(/\b(no|na|em|de|do|da|com|e)\b/gi, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  if(!desc) desc = category;
  desc = desc.charAt(0).toUpperCase() + desc.slice(1);
  if(desc.length > 40) desc = desc.slice(0, 40).trim();

  return { is_expense: true, amount, category, description: desc, payment };
}

async function handleSend(){
  const text = input.value.trim();
  if(!text) return;
  sendBtn.disabled = true;
  input.value = '';

  try{
    const parsed = await parseExpense(text);
    if(parsed.is_expense && typeof parsed.amount === 'number'){
      const category = CATEGORIES[parsed.category] ? parsed.category : 'Outros';
      const expense = {
        id: Date.now() + Math.random().toString(36).slice(2,7),
        amount: parsed.amount,
        category,
        description: parsed.description || text,
        payment: parsed.payment || 'Não informado',
        date: new Date().toISOString()
      };
      expenses.push(expense);
      await saveExpenses();
      render();
      showToast(`Registrado: ${fmt(expense.amount)} · ${category} · ${expense.payment}`);
    } else {
      showToast('Não entendi como um gasto. Tenta algo como "gastei 20 no mercado no débito".', true);
    }
  }catch(e){
    showToast('Erro ao processar. Tenta de novo.', true);
  }finally{
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleSend(); });

// ---------- Entrada por voz (reconhecimento de fala nativo do navegador) ----------
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isRecording = false;

if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.lang = 'pt-BR';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    input.value = transcript;
    handleSend();
  };
  recognition.onerror = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
    showToast('Não consegui ouvir. Tenta de novo.', true);
  };
  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
  };
}

micBtn.addEventListener('click', () => {
  if(!recognition){
    showToast('Entrada por voz não é suportada nesse navegador. Funciona bem no Chrome.', true);
    return;
  }
  if(isRecording){
    recognition.stop();
    return;
  }
  isRecording = true;
  micBtn.classList.add('recording');
  try{
    recognition.start();
  }catch(e){
    isRecording = false;
    micBtn.classList.remove('recording');
  }
});
