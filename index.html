<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Livro Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F3F6F1;
    --paper-alt: #E9F1E9;
    --paper-line: #D3E2D5;
    --ink: #1E2B22;
    --ink-soft: #62705F;
    --emerald: #1F7A4D;
    --emerald-deep: #16603C;
    --amber: #B8862B;
    --rust: #A34D33;
    --card: #FFFFFF;
    --shadow: 0 1px 2px rgba(30,43,34,0.06), 0 2px 8px rgba(30,43,34,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--paper);
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 35px, rgba(31,122,77,0.05) 35px, rgba(31,122,77,0.05) 70px);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    padding-bottom: 110px;
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px;
  }
  header{
    padding: 28px 16px 18px;
    text-align: center;
  }
  header .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--emerald);
    font-weight: 500;
  }
  header h1{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 34px;
    margin: 4px 0 2px;
    letter-spacing: -0.01em;
  }
  header p{
    margin: 0;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .tabs{
    display: flex;
    gap: 6px;
    margin: 18px 0 14px;
    background: var(--paper-alt);
    border: 1px solid var(--paper-line);
    border-radius: 12px;
    padding: 4px;
  }
  .tab{
    flex: 1;
    text-align: center;
    padding: 8px 0;
    font-size: 13px;
    font-weight: 600;
    border-radius: 9px;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all .15s ease;
    user-select: none;
  }
  .tab.active{
    background: var(--card);
    color: var(--emerald-deep);
    box-shadow: var(--shadow);
  }

  .summary-card{
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    margin-bottom: 16px;
  }
  .summary-top{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .summary-top .label{
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .summary-top .total{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
  }
  .cat-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin: 9px 0;
  }
  .cat-dot{
    width: 8px; height: 8px; border-radius: 50%; flex-shrink:0;
  }
  .cat-name{
    font-size: 13px;
    width: 92px;
    flex-shrink: 0;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cat-bar-bg{
    flex: 1;
    height: 6px;
    background: var(--paper-alt);
    border-radius: 4px;
    overflow: hidden;
  }
  .cat-bar-fill{
    height: 100%;
    border-radius: 4px;
    transition: width .4s ease;
  }
  .cat-val{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    width: 66px;
    text-align: right;
    flex-shrink: 0;
  }
  .empty-summary{
    color: var(--ink-soft);
    font-size: 13px;
    text-align: center;
    padding: 10px 0;
  }

  .ledger{
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .day-header{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 12px 18px 6px;
    background: var(--paper-alt);
  }
  .entry{
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--paper-line);
    cursor: pointer;
  }
  .entry:last-child{ border-bottom: none; }
  .entry:active{ background: var(--paper-alt); }
  .entry .cat-dot{ margin-bottom: 2px; }
  .entry .desc{
    font-size: 14.5px;
    color: var(--ink);
    flex-shrink: 0;
    max-width: 55%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .entry .leader{
    flex: 1;
    border-bottom: 1.5px dotted var(--paper-line);
    height: 1px;
    margin-bottom: 4px;
  }
  .entry .amount{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink);
    flex-shrink: 0;
  }
  .empty-state{
    text-align: center;
    padding: 48px 24px;
    color: var(--ink-soft);
  }
  .empty-state .big{
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty-state .small{ font-size: 13px; line-height: 1.5; }

  .compose{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(243,246,241,0) 0%, var(--paper) 22%);
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .compose-inner{
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(30,43,34,0.14);
    padding: 6px 6px 6px 16px;
    align-items: center;
  }
  .compose-inner input{
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: transparent;
    padding: 10px 0;
  }
  .compose-inner input::placeholder{ color: #A9B5A6; }
  .send-btn{
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--emerald);
    border: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s, transform .1s;
  }
  .send-btn:active{ transform: scale(0.94); }
  .send-btn:disabled{ background: #B7C4B4; }
  .send-btn svg{ width: 18px; height: 18px; }

  .toast{
    position: fixed;
    top: 18px; left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: var(--ink);
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    transition: transform .25s ease;
    z-index: 100;
  }
  .toast.show{ transform: translateX(-50%) translateY(0); }
  .toast.error{ background: var(--rust); }

  .modal-backdrop{
    position: fixed; inset: 0;
    background: rgba(30,43,34,0.35);
    display: flex; align-items: flex-end;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .modal-backdrop.show{ opacity: 1; pointer-events: auto; }
  .modal{
    background: var(--card);
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(20px);
    transition: transform .2s ease;
  }
  .modal-backdrop.show .modal{ transform: translateY(0); }
  .modal .m-desc{ font-family:'Fraunces', serif; font-size: 18px; margin-bottom: 2px;}
  .modal .m-cat{ font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .modal .m-amount{ font-family:'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; margin-bottom: 18px;}
  .modal button{
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .m-delete{ background: #F7E8E4; color: var(--rust); }
  .m-cancel{ background: var(--paper-alt); color: var(--ink-soft); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Livro Caixa</div>
    <h1>Seus gastos</h1>
    <p>Digite naturalmente, eu categorizo pra você</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-period="month">Este mês</div>
    <div class="tab" data-period="all">Tudo</div>
  </div>

  <div class="summary-card">
    <div class="summary-top">
      <div class="label" id="summaryLabel">Total do mês</div>
      <div class="total" id="summaryTotal">R$ 0,00</div>
    </div>
    <div id="catBars"></div>
  </div>

  <div class="ledger" id="ledger"></div>
</div>

<div class="compose">
  <div class="compose-inner">
    <input id="input" type="text" placeholder="ex: gastei 2,50 no posto" autocomplete="off" />
    <button class="send-btn" id="sendBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="m-desc" id="mDesc"></div>
    <div class="m-cat" id="mCat"></div>
    <div class="m-amount" id="mAmount"></div>
    <button class="m-delete" id="mDelete">Excluir lançamento</button>
    <button class="m-cancel" id="mCancel">Cancelar</button>
  </div>
</div>

<script>
const CATEGORIES = {
  "Alimentação": "#B5541F",
  "Transporte": "#3C6E91",
  "Combustível": "#8B3A3A",
  "Moradia": "#6B5B95",
  "Saúde": "#2F8F6B",
  "Lazer": "#C9A227",
  "Compras": "#A15A9E",
  "Educação": "#3E7D5A",
  "Outros": "#7A7A72"
};

let expenses = [];
let period = "month";
let pendingDeleteId = null;

const el = (id) => document.getElementById(id);
const input = el("input");
const sendBtn = el("sendBtn");
const toast = el("toast");
const ledger = el("ledger");
const catBars = el("catBars");
const summaryTotal = el("summaryTotal");
const summaryLabel = el("summaryLabel");

function fmt(v){
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function showToast(msg, isError){
  toast.textContent = msg;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

function loadExpenses(){
  try{
    const raw = localStorage.getItem('livrocaixa_expenses');
    expenses = raw ? JSON.parse(raw) : [];
  }catch(e){
    expenses = [];
  }
  render();
}

function saveExpenses(){
  try{
    localStorage.setItem('livrocaixa_expenses', JSON.stringify(expenses));
  }catch(e){
    showToast('Não consegui salvar. Tenta de novo.', true);
  }
}

function filteredExpenses(){
  if(period === 'all') return expenses;
  const now = new Date();
  return expenses.filter(e => {
    const d = new Date(e.date);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
}

function render(){
  const list = filteredExpenses();
  renderSummary(list);
  renderLedger(list);
}

function renderSummary(list){
  summaryLabel.textContent = period === 'all' ? 'Total geral' : 'Total do mês';
  const total = list.reduce((s,e) => s + e.amount, 0);
  summaryTotal.textContent = fmt(total);

  const byCat = {};
  list.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
  const sorted = Object.entries(byCat).sort((a,b) => b[1]-a[1]);

  if(sorted.length === 0){
    catBars.innerHTML = '<div class="empty-summary">Nenhum gasto ainda.</div>';
    return;
  }

  catBars.innerHTML = sorted.map(([cat, val]) => {
    const color = CATEGORIES[cat] || CATEGORIES["Outros"];
    const pct = total > 0 ? (val/total*100) : 0;
    return `<div class="cat-row">
      <div class="cat-dot" style="background:${color}"></div>
      <div class="cat-name">${cat}</div>
      <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%; background:${color}"></div></div>
      <div class="cat-val">${fmt(val)}</div>
    </div>`;
  }).join('');
}

function renderLedger(list){
  if(list.length === 0){
    ledger.innerHTML = `<div class="empty-state">
      <div class="big">Página em branco</div>
      <div class="small">Manda seu primeiro gasto aqui embaixo,<br>tipo "gastei 15 no almoço".</div>
    </div>`;
    return;
  }

  const sorted = [...list].sort((a,b) => new Date(b.date) - new Date(a.date));
  const groups = {};
  sorted.forEach(e => {
    const d = new Date(e.date);
    const key = d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', weekday: 'short' });
    if(!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  ledger.innerHTML = Object.entries(groups).map(([day, items]) => {
    const rows = items.map(e => {
      const color = CATEGORIES[e.category] || CATEGORIES["Outros"];
      return `<div class="entry" data-id="${e.id}">
        <div class="cat-dot" style="background:${color}"></div>
        <div class="desc">${escapeHtml(e.description)}</div>
        <div class="leader"></div>
        <div class="amount">${fmt(e.amount)}</div>
      </div>`;
    }).join('');
    return `<div class="day-header">${day}</div>${rows}`;
  }).join('');

  ledger.querySelectorAll('.entry').forEach(node => {
    node.addEventListener('click', () => openModal(node.dataset.id));
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function openModal(id){
  const e = expenses.find(x => String(x.id) === String(id));
  if(!e) return;
  pendingDeleteId = e.id;
  el('mDesc').textContent = e.description;
  el('mCat').textContent = e.category;
  el('mAmount').textContent = fmt(e.amount);
  el('modalBackdrop').classList.add('show');
}

el('mCancel').addEventListener('click', () => {
  el('modalBackdrop').classList.remove('show');
});
el('modalBackdrop').addEventListener('click', (ev) => {
  if(ev.target.id === 'modalBackdrop') el('modalBackdrop').classList.remove('show');
});
el('mDelete').addEventListener('click', async () => {
  expenses = expenses.filter(e => e.id !== pendingDeleteId);
  await saveExpenses();
  render();
  el('modalBackdrop').classList.remove('show');
  showToast('Lançamento excluído.');
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    period = tab.dataset.period;
    render();
  });
});

const CATEGORY_KEYWORDS = {
  "Alimentação": ["mercado","supermercado","almoço","almoco","jantar","lanche","restaurante","ifood","padaria","comida","café","cafe","feira","pizza","hamburguer","hambúrguer"],
  "Transporte": ["uber","99","ônibus","onibus","metrô","metro","passagem","estacionamento","pedágio","pedagio","táxi","taxi"],
  "Combustível": ["posto","gasolina","álcool","alcool","etanol","combustível","combustivel","diesel"],
  "Moradia": ["aluguel","condomínio","condominio","luz","energia","água","agua","internet","gás","gas","iptu"],
  "Saúde": ["farmácia","farmacia","remédio","remedio","médico","medico","consulta","exame","dentista","plano de saúde","academia"],
  "Lazer": ["cinema","show","viagem","bar","festa","balada","jogo","streaming","netflix","spotify"],
  "Compras": ["loja","roupa","shopping","compra","tênis","tenis","sapato","presente"],
  "Educação": ["curso","livro","faculdade","escola","mensalidade","material escolar"]
};

function parseExpense(text){
  const lower = text.toLowerCase();

  // procura um valor numérico na frase (com vírgula, ponto, "reais" ou "R$")
  const amountMatch = lower.match(/(?:r\$\s*)?(\d{1,6}(?:[.,]\d{1,2})?)\s*(?:reais)?/);
  if(!amountMatch){
    return { is_expense: false };
  }
  const amount = parseFloat(amountMatch[1].replace(',', '.'));
  if(isNaN(amount) || amount <= 0){
    return { is_expense: false };
  }

  // identifica categoria por palavra-chave
  let category = 'Outros';
  outer:
  for(const [cat, keywords] of Object.entries(CATEGORY_KEYWORDS)){
    for(const kw of keywords){
      if(lower.includes(kw)){
        category = cat;
        break outer;
      }
    }
  }

  // monta uma descrição limpa removendo verbos comuns e o valor
  let desc = text
    .replace(/gastei|paguei|comprei|gasto de|gasto com|foi/gi, '')
    .replace(amountMatch[0], '')
    .replace(/reais|r\$/gi, '')
    .replace(/^\s*(no|na|em|de|do|da|com)\s+/i, '')
    .trim();
  if(!desc) desc = category;
  desc = desc.charAt(0).toUpperCase() + desc.slice(1);
  if(desc.length > 40) desc = desc.slice(0, 40).trim();

  return { is_expense: true, amount, category, description: desc };
}

async function handleSend(){
  const text = input.value.trim();
  if(!text) return;
  sendBtn.disabled = true;
  input.value = '';

  try{
    const parsed = await parseExpense(text);
    if(parsed.is_expense && typeof parsed.amount === 'number'){
      const category = CATEGORIES[parsed.category] ? parsed.category : 'Outros';
      const expense = {
        id: Date.now() + Math.random().toString(36).slice(2,7),
        amount: parsed.amount,
        category,
        description: parsed.description || text,
        date: new Date().toISOString()
      };
      expenses.push(expense);
      await saveExpenses();
      render();
      showToast(`Registrado: ${fmt(expense.amount)} · ${category}`);
    } else {
      showToast('Não entendi como um gasto. Tenta algo como "gastei 20 no mercado".', true);
    }
  }catch(e){
    showToast('Erro ao processar. Tenta de novo.', true);
  }finally{
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleSend(); });

loadExpenses();
</script>
</body>
</html>
